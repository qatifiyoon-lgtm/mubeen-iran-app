plugins { id 'com.android.application' }

android {
    namespace 'com.mubeennews.iran'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mubeennews.iran'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('mubeen.jks')
            storePassword 'mubeen2026'
            keyAlias 'mubeen'
            keyPassword 'mubeen2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
