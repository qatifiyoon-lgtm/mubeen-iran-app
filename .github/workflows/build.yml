name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Cairo.ttf "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" || echo "cairo font skipped"
          curl -fsSL -o app/src/main/assets/fonts/Amiri-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf" || echo "amiri font skipped"
          ls -la app/src/main/assets/fonts

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk MubeenNews-Iran.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MubeenNews-Iran
          path: MubeenNews-Iran.apk
